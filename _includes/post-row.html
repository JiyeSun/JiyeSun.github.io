{% assign post = include.post %}
<article class="post-row" data-post data-search="{{ post.title | escape }} {{ post.description | escape }} {{ post.tags | join: ' ' | escape }}">
  <div class="post-meta"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%Y.%m.%d' }}</time><span>{% if post.kind == 'note' %}短笔记{% else %}文章{% endif %}</span></div>
  <div class="post-summary">
    <div class="post-labels">{% if post.sample %}<span class="sample-label">示例</span>{% endif %}{% for tag in post.tags %}<span>{{ tag | escape }}</span>{% endfor %}</div>
    <h3><a href="{{ post.url }}">{{ post.title | escape }}</a></h3>
    <p>{{ post.description | escape }}</p>
  </div>
  <a class="row-arrow" href="{{ post.url }}" aria-label="阅读：{{ post.title | escape }}"><span aria-hidden="true">↗</span></a>
</article>
